services:
  - type: web
    name: lecture-summarizer
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --log-level info
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false          # Set this in the Render dashboard
      - key: NVIDIA_API_KEY
        sync: false          # Set this in the Render dashboard (optional)
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false          # Paste your full serviceAccountKey.json contents here
